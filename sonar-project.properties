# SonarCloud configuration for devcontainer-features
# This repo contains only shell scripts for devcontainer features.
# Shell scripts trigger security hotspots for patterns that are
# safe and expected in this context (curl|bash, eval, chown with
# variables). We suppress these to avoid false positive failures.

sonar.projectKey=docker-x_devcontainers
sonar.organization=docker-x

# Shell scripts are the only source files
sonar.sources=src/features
sonar.inclusions=**/*.sh

# Security hotspots in shell install scripts are expected patterns:
# - curl|bash: standard devcontainer feature install method
# - eval echo: tilde expansion for _REMOTE_USER_HOME
# - chown $REMOTE_USER: setting file ownership for container user
# These run at image build time with trusted inputs.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S2077
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=shell:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e4.ruleKey=shell:S2230
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.sh

# Security hotspots are reviewed individually. All curl commands use
# --proto =https to enforce HTTPS-only connections (shell:S6506).
# Previously a blanket hotspot exclusion hid all shell hotspots; it was
# removed so that new hotspots are surfaced and reviewed.
