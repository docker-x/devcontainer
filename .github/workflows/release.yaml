name: "Release Dev Container Features & Templates"

on:
  workflow_dispatch:

jobs:
  publish-features:
    name: Publish Features
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Publish Features"
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./src/features"
          features-namespace: "docker-x/devcontainer"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create PR for Feature Documentation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config pull.rebase false
          branch="automated-docs-features-${{ github.run_id }}"
          git checkout -b "$branch"
          git add src/features/**/README.md src/features/**/NOTES.md 2>/dev/null || true
          git commit -m "Automated feature documentation update [skip ci]" || exit 0
          git push origin "$branch"
          gh pr create --title "Automated feature documentation update" --body "Updates generated by devcontainers/action."

  publish-templates:
    name: Publish Templates
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Publish Templates"
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src/templates"
          templates-namespace: "docker-x/devcontainer/templates"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create PR for Template Documentation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config pull.rebase false
          branch="automated-docs-templates-${{ github.run_id }}"
          git checkout -b "$branch"
          git add src/templates/**/README.md src/templates/**/NOTES.md 2>/dev/null || true
          git commit -m "Automated template documentation update [skip ci]" || exit 0
          git push origin "$branch"
          gh pr create --title "Automated template documentation update" --body "Updates generated by devcontainers/action."
